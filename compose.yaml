services:
  db:
    image: postgres:16
    container_name: pododiab-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pododiab}
      POSTGRES_USER: ${POSTGRES_USER:-pododiab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pododiab_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-pododiab} -d ${POSTGRES_DB:-pododiab}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
